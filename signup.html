
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Everygreen Dairy Farm</title>

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="signup.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <main class="signup-page">

        <!-- Dark Mode and RTL Outside the Card -->
        <div class="signup-top-actions">
            <button type="button" class="signup-icon-btn"
                    id="themeBtn" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>

            <button type="button" class="signup-icon-btn"
                    id="directionBtn" aria-label="Toggle text direction">
                <i class="fas fa-globe"></i>
            </button>
        </div>

        <section class="signup-card">

            <header class="signup-header">
                <a href="index.html" class="signup-logo">
                    <img src="images/logo-1.png"
                         alt="Everygreen Dairy Farm Logo">
                </a>

                <h1>Everygreen <span>Dairy Farm</span></h1>
                <h2>Create Your Account</h2>
                <p>Join our farm family for fresh and healthy dairy products.</p>
            </header>

            <form class="signup-form" id="signupForm" novalidate>

                <!-- Full Name and Phone Number -->
                <div class="signup-form-row">

                    <div class="form-group">
                        <label for="fullName">Full Name</label>

                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Enter your name"
                                autocomplete="name"
                                required
                            >
                        </div>

                        <small class="error-message" id="nameError"></small>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>

                        <div class="input-wrapper">
                            <i class="fas fa-phone input-icon"></i>
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Phone number"
                                autocomplete="tel"
                                inputmode="tel"
                                required
                            >
                        </div>

                        <small class="error-message" id="phoneError"></small>
                    </div>

                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <small class="error-message" id="emailError"></small>
                </div>

                <!-- Password and Confirm Password -->
                <div class="signup-form-row">

                    <div class="form-group">
                        <label for="password">Password</label>

                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="password"
                                aria-label="Show password"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>

                        <small class="error-message" id="passwordError"></small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>

                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                                aria-label="Show password"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>

                        <small class="error-message" id="confirmPasswordError"></small>
                    </div>

                </div>

                <!-- Terms and Privacy -->
                <div class="signup-terms">
                    <label class="terms-label">
                        <input type="checkbox" id="terms" required>

                        <span>
                            I agree to the
                            <a href="terms.html">Terms</a> and
                            <a href="privacy.html">Privacy Policy</a>.
                        </span>
                    </label>

                    <small class="error-message" id="termsError"></small>
                </div>

                <!-- Create Account -->
                <button type="submit" class="signup-btn">
                    Create Account
                    <i class="fas fa-arrow-right"></i>
                </button>

                <!-- Login Link -->
                <p class="signup-login-text">
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </p>

                <!-- Farm Note -->
                <div class="signup-note">
                    <i class="fas fa-leaf"></i>
                    <span>
                        Fresh products, healthy living, and a greener tomorrow.
                    </span>
                </div>

                <p class="signup-status" id="signupStatus"
                   role="status" aria-live="polite"></p>

            </form>
        </section>

    </main>

    <script>
    
document.addEventListener("DOMContentLoaded", function () {
    const html = document.documentElement;
    const themeBtn = document.getElementById("themeBtn");
    const directionBtn = document.getElementById("directionBtn");
    const signupForm = document.getElementById("signupForm");
    const signupStatus = document.getElementById("signupStatus");

    /* Theme */
    function applyTheme(theme) {
        html.classList.toggle("dark-mode", theme === "dark");

        const icon = themeBtn.querySelector("i");

        icon.className = theme === "dark"
            ? "fas fa-sun"
            : "fas fa-moon";

        themeBtn.setAttribute(
            "aria-label",
            theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
        );
    }

    applyTheme(localStorage.getItem("everygreenTheme") || "light");

    themeBtn.addEventListener("click", function () {
        const newTheme = html.classList.contains("dark-mode")
            ? "light"
            : "dark";

        localStorage.setItem("everygreenTheme", newTheme);
        applyTheme(newTheme);
    });

    /* Text Direction */
    function applyDirection(direction) {
        html.setAttribute("dir", direction);

        directionBtn.innerHTML = direction === "rtl"
            ? '<i class="fas fa-align-right"></i>'
            : '<i class="fas fa-globe"></i>';

        directionBtn.setAttribute(
            "aria-label",
            direction === "rtl"
                ? "Switch to left-to-right direction"
                : "Switch to right-to-left direction"
        );
    }

    applyDirection(
        localStorage.getItem("everygreenDirection") || "ltr"
    );

    directionBtn.addEventListener("click", function () {
        const newDirection = html.getAttribute("dir") === "rtl"
            ? "ltr"
            : "rtl";

        localStorage.setItem("everygreenDirection", newDirection);
        applyDirection(newDirection);
    });

    /* Show and Hide Password */
    document.querySelectorAll(".password-toggle").forEach(function (button) {
        button.addEventListener("click", function () {
            const target = document.getElementById(
                button.getAttribute("data-target")
            );

            const showPassword = target.type === "password";

            target.type = showPassword ? "text" : "password";

            button.innerHTML = showPassword
                ? '<i class="fas fa-eye-slash"></i>'
                : '<i class="fas fa-eye"></i>';

            button.setAttribute(
                "aria-label",
                showPassword ? "Hide password" : "Show password"
            );
        });
    });

    /* Clear Error Messages */
    function clearErrors() {
        document.querySelectorAll(".error-message").forEach(function (error) {
            error.textContent = "";
        });

        signupStatus.textContent = "";
    }

    /* Form Validation */
    signupForm.addEventListener("submit", function (event) {
        event.preventDefault();
        clearErrors();

        const fullName = document.getElementById("fullName").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;
        const terms = document.getElementById("terms").checked;

        let valid = true;

        if (fullName.length < 2) {
            document.getElementById("nameError").textContent =
                "Please enter your full name.";
            valid = false;
        }

        const phoneDigits = phone.replace(/\D/g, "");

        if (phoneDigits.length < 7 || phoneDigits.length > 15) {
            document.getElementById("phoneError").textContent =
                "Please enter a valid phone number.";
            valid = false;
        }

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
            document.getElementById("emailError").textContent =
                "Please enter a valid email address.";
            valid = false;
        }

        if (password.length < 8) {
            document.getElementById("passwordError").textContent =
                "Password must contain at least 8 characters.";
            valid = false;
        }

        if (confirmPassword !== password) {
            document.getElementById("confirmPasswordError").textContent =
                "Passwords do not match.";
            valid = false;
        }

        if (!terms) {
            document.getElementById("termsError").textContent =
                "Please accept the Terms and Privacy Policy.";
            valid = false;
        }

        if (!valid) {
            signupStatus.textContent =
                "Please correct the highlighted fields.";
            return;
        }

        signupStatus.textContent =
            "Form validated. Connect a backend to create your account.";
    });
});

    </script>
</body>
</html>
